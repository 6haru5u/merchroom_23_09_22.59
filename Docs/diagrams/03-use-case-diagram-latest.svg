30" cy="911" r="9" fill="#18151c"/><path d="M115 940Q130 923 145 940V945H115Z" fill="#18151c"/><text x="130" y="982" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="18" font-weight="800">Customer</text><text x="130" y="1005" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">signed in</text></g><g><circle cx="2200" cy="570" r="34" fill="#7653df"/><circle cx="2200" cy="561" r="9" fill="#18151c"/><path d="M2185 590Q2200 573 2215 590V595H2185Z" fill="#18151c"/><text x="2200" y="632" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="18" font-weight="800">Admin</text><text x="2200" y="655" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">signed in + role=admin</text></g><g><circle cx="2200" cy="1040" r="34" fill="#43d8cc"/><circle cx="2200" cy="1031" r="9" fill="#18151c"/><path d="M2185 1060Q2200 1043 2215 1060V1065H2185Z" fill="#18151c"/><text x="2200" y="1102" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="18" font-weight="800">Payment Provider</text><text x="2200" y="1125" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">Omise card / QR intent</text></g><g><circle cx="2200" cy="1220" r="34" fill="#f27aad"/><circle cx="2200" cy="1211" r="9" fill="#18151c"/><path d="M2185 1240Q2200 1223 2215 1240V1245H2185Z" fill="#18151c"/><text x="2200" y="1282" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="18" font-weight="800">Gemini AI</text><text x="2200" y="1305" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">Nong Hed agent</text></g><g filter="url(#shadow)"><rect x="470" y="390" width="270" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="605" y="426" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Browse / search products</text></g><g filter="url(#shadow)"><rect x="800" y="390" width="260" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="930" y="426" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">View product + reviews</text></g><g filter="url(#shadow)"><rect x="1130" y="390" width="250" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="1255" y="426" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Register / login / logout</text></g><g filter="url(#shadow)"><rect x="1460" y="390" width="300" height="58" rx="29" fill="#1a181f" stroke="#ff7046" stroke-width="2"/><text x="1610" y="426" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Manage profile + password</text></g><g filter="url(#shadow)"><rect x="470" y="610" width="250" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="595" y="646" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Add / edit / clear cart</text></g><g filter="url(#shadow)"><rect x="800" y="610" width="250" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="925" y="646" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Validate promo code</text></g><g filter="url(#shadow)"><rect x="1130" y="610" width="300" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="1280" y="646" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Checkout + create order</text></g><g filter="url(#shadow)"><rect x="1510" y="610" width="300" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="1660" y="646" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">View / cancel own order</text></g><g filter="url(#shadow)"><rect x="440" y="830" width="310" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="595" y="866" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Create / edit / delete own review</text></g><g filter="url(#shadow)"><rect x="800" y="830" width="280" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="940" y="866" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Ask Nong Hed AI agent</text></g><g filter="url(#shadow)"><rect x="1130" y="830" width="300" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="1280" y="866" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Pay by card / request PromptPay QR</text></g><g filter="url(#shadow)"><rect x="1510" y="830" width="300" height="58" rx="29" fill="#1a181f" stroke="#7653df" stroke-width="2"/><text x="1660" y="866" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Receive order SSE updates</text></g><g filter="url(#shadow)"><rect x="470" y="1070" width="300" height="58" rx="29" fill="#1a181f" stroke="#ff7046" stroke-width="2"/><text x="620" y="1106" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">View dashboard / reports</text></g><g filter="url(#shadow)"><rect x="830" y="1070" width="350" height="58" rx="29" fill="#1a181f" stroke="#ff7046" stroke-width="2"/><text x="1005" y="1106" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Manage products + stock</text></g><g filter="url(#shadow)"><rect x="1240" y="1070" width="330" height="58" rx="29" fill="#1a181f" stroke="#ff7046" stroke-width="2"/><text x="1405" y="1106" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Manage categories / promos</text></g><g filter="url(#shadow)"><rect x="1630" y="1070" width="280" height="58" rx="29" fill="#1a181f" stroke="#ff7046" stroke-width="2"/><text x="1770" y="1106" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="16" font-weight="700">Manage orders + local refund</text></g><path d="M164 450L470 420" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 470L800 420" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 490L1130 420" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 900L470 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 920L800 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 940L1130 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 960L1510 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 980L470 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 1000L800 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 1020L1130 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 1040L1510 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M164 1060L1460 420" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 550L470 1100" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 570L830 1100" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 590L1240 1100" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 610L1630 1100" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 630L1510 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><path d="M2165 1020L1280 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><text x="1722.5" y="934" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="12">charge / QR intent</text><path d="M2165 1040L1280 640" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><text x="1722.5" y="834" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="12">payment status</text><path d="M2165 1200L940 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><text x="1552.5" y="1024" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="12">function calls</text><path d="M2165 1220L1510 860" stroke="#d8ff3e" stroke-width="2" opacity=".9"/><text x="1837.5" y="1034" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="12">recommendations</text><text x="390" y="1340" fill="#b9b4c9" font-family="Arial" font-size="14">Security boundary: protected routes require authUser; administrative operations additionally require adminOnly. The chatbot only gets product facts by querying the live product database.</text></svg>