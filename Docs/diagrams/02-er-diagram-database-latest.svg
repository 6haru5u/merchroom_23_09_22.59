h d="M460 1245 L565 1245" stroke="#d8ff3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="380.4" y="1207" width="263.20000000000005" height="25" rx="12" fill="#111014"/><text x="512" y="1225" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="14" font-weight="700">Order 1 : N Payment attempts</text><path d="M1310 760 L1240 760 L1240 180 L400 180 L400 310" stroke="#d8ff3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="696.8" y="150" width="246.4" height="25" rx="12" fill="#111014"/><text x="820" y="168" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="14" font-weight="700">Review N : 1 User (author)</text><path d="M1310 805 L1190 805" stroke="#d8ff3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1152" y="774" width="196" height="25" rx="12" fill="#111014"/><text x="1250" y="792" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="14" font-weight="700">Product 1 : N Review</text><path d="M1760 400 L1500 400 L1500 1040 L1100 1040 L1100 990" stroke="#d8ff3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1310" y="1010" width="280" height="25" rx="12" fill="#111014"/><text x="1450" y="1028" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="14" font-weight="700">ProductChangeLog N : 1 Product</text><path d="M1760 350 L1540 350 L1540 210 L400 210 L400 310" stroke="#d8ff3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="939" y="180" width="322" height="25" rx="12" fill="#111014"/><text x="1100" y="198" text-anchor="middle" fill="#d8ff3e" font-family="Arial" font-size="14" font-weight="700">ProductChangeLog N : 1 User (actor)</text><text x="70" y="1460" fill="#b9b4c9" font-family="Arial" font-size="15">Seed baseline (server/seed.js): 15 users (9 customer / 6 admin), 5 categories, 14 artists/groups, 32 products, and 3 orders. Cart, Payment, Review, PromoCode and ProductChangeLog collections are cleared but not seeded.</text><text x="70" y="1490" fill="#b9b4c9" font-family="Arial" font-size="15">*Payment references one Order; the schema does not enforce a unique orderId, therefore more than one payment attempt can technically be stored.</text></svg>