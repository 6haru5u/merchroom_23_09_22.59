<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1540" viewBox="0 0 2400 1540">
<defs><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".28"/></filter><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#4930a5"/><stop offset="1" stop-color="#7653df"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#d94f37"/><stop offset="1" stop-color="#ff7046"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop stop-color="#bade32"/><stop offset="1" stop-color="#d8ff3e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d8ff3e"/></marker></defs><rect width="100%" height="100%" fill="#111014"/><text x="70" y="92" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="52" font-weight="800">MERCHROOM —</text><text x="70" y="152" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="52" font-weight="800">Database ER Diagram</text><text x="72" y="190" fill="#b9b4c9" font-family="Arial, sans-serif" font-size="21">MongoDB / Mongoose schemas · fields, embedded documents, encrypted personal data, and relationships</text><text x="2050" y="68" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">DATABASE MODEL</text><rect x="2220" y="53" width="70" height="7" rx="4" fill="#d8ff3e"/><text x="70" y="248" fill="#d8ff3e" font-family="Arial" font-size="17" font-weight="800">RELATIONSHIP LEGEND</text><text x="300" y="248" fill="#b9b4c9" font-family="Arial" font-size="16">PK = primary identifier · FK = ObjectId reference · [ ] = stored encrypted at rest · arrays are embedded fields</text><g filter="url(#shadow)"><rect x="80" y="310" width="360" height="310" rx="20" fill="#1a181f" stroke="url(#purple)" stroke-width="3"/><path d="M80 330Q80 310 100 310H420Q440 310 440 330V368H80Z" fill="url(#purple)"/><text x="102" y="348" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">USER</text><text x="102" y="392" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="102" y="414" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">email / firstName / lastName / phone / address  [AES-256-GCM encrypted]</text><text x="102" y="436" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">emailLookup  unique + indexed (HMAC lookup)</text><text x="102" y="458" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">password  bcrypt hash (10 rounds)</text><text x="102" y="480" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">role  customer | admin · employeeId</text><text x="102" y="502" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">interests[] · paymentMethods[] · profilePicture · socialAccounts[]</text><text x="102" y="524" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="525" y="270" width="340" height="260" rx="20" fill="#1a181f" stroke="url(#purple)" stroke-width="3"/><path d="M525 290Q525 270 545 270H845Q865 270 865 290V328H525Z" fill="url(#purple)"/><text x="547" y="308" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">ARTIST</text><text x="547" y="352" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="547" y="374" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">name  unique · realName</text><text x="547" y="396" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">type  solo | band | group</text><text x="547" y="418" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">bio · style · socialLinks[] · profilePic</text><text x="547" y="440" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="970" y="270" width="340" height="230" rx="20" fill="#1a181f" stroke="url(#orange)" stroke-width="3"/><path d="M970 290Q970 270 990 270H1290Q1310 270 1310 290V328H970Z" fill="url(#orange)"/><text x="992" y="308" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">CATEGORY</text><text x="992" y="352" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="992" y="374" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">name  unique · slug  unique</text><text x="992" y="396" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">description</text><text x="992" y="418" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="750" y="620" width="440" height="370" rx="20" fill="#1a181f" stroke="url(#orange)" stroke-width="3"/><path d="M750 640Q750 620 770 620H1170Q1190 620 1190 640V678H750Z" fill="url(#orange)"/><text x="772" y="658" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">PRODUCT</text><text x="772" y="702" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="772" y="724" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">category  FK → Category  (required)</text><text x="772" y="746" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">artist  FK → Artist  (optional)</text><text x="772" y="768" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">name · description · price · quantity · date</text><text x="772" y="790" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">tags[] incl. genre:&lt;id&gt; · national</text><text x="772" y="812" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">style · medium · sizes[]</text><text x="772" y="834" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">imageUrl · imageUrls[] · imageFit</text><text x="772" y="856" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="80" y="760" width="360" height="235" rx="20" fill="#1a181f" stroke="url(#orange)" stroke-width="3"/><path d="M80 780Q80 760 100 760H420Q440 760 440 780V818H80Z" fill="url(#orange)"/><text x="102" y="798" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">CART</text><text x="102" y="842" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="102" y="864" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">userId  FK → User</text><text x="102" y="886" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">items[]  embedded CartItem</text><text x="102" y="908" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">  productId FK → Product · variant_id · quantity</text><text x="102" y="930" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="80" y="1090" width="380" height="310" rx="20" fill="#1a181f" stroke="url(#orange)" stroke-width="3"/><path d="M80 1110Q80 1090 100 1090H440Q460 1090 460 1110V1148H80Z" fill="url(#orange)"/><text x="102" y="1128" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">ORDER</text><text x="102" y="1172" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="102" y="1194" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">userId  FK → User</text><text x="102" y="1216" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">items[]  embedded OrderItem snapshot</text><text x="102" y="1238" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">  productId FK → Product · name · price · quantity</text><text x="102" y="1260" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">totalAmount · status · shippingProvider</text><text x="102" y="1282" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">shippingAddress · purchaseDate</text><text x="102" y="1304" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="565" y="1110" width="360" height="270" rx="20" fill="#1a181f" stroke="url(#purple)" stroke-width="3"/><path d="M565 1130Q565 1110 585 1110H905Q925 1110 925 1130V1168H565Z" fill="url(#purple)"/><text x="587" y="1148" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">PAYMENT</text><text x="587" y="1192" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="587" y="1214" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">orderId  FK → Order</text><text x="587" y="1236" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">amount · method · status · provider</text><text x="587" y="1258" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">providerChargeId (indexed) · cardBrand</text><text x="587" y="1280" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">cardLastDigits · failureCode · failureMessage</text><text x="587" y="1302" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="1310" y="690" width="350" height="225" rx="20" fill="#1a181f" stroke="url(#purple)" stroke-width="3"/><path d="M1310 710Q1310 690 1330 690H1640Q1660 690 1660 710V748H1310Z" fill="url(#purple)"/><text x="1332" y="728" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">REVIEW</text><text x="1332" y="772" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="1332" y="794" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">userId  FK → User</text><text x="1332" y="816" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">productId  FK → Product</text><text x="1332" y="838" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">rating  1–5 · comment</text><text x="1332" y="860" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text></g><g filter="url(#shadow)"><rect x="1760" y="300" width="420" height="260" rx="20" fill="#1a181f" stroke="url(#purple)" stroke-width="3"/><path d="M1760 320Q1760 300 1780 300H2160Q2180 300 2180 320V358H1760Z" fill="url(#purple)"/><text x="1782" y="338" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">PRODUCT CHANGE LOG</text><text x="1782" y="382" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="1782" y="404" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">productId  FK → Product</text><text x="1782" y="426" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">actor  FK → User</text><text x="1782" y="448" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">action  created | updated | deleted</text><text x="1782" y="470" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">productName · before · after</text><text x="1782" y="492" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt only</text></g><g filter="url(#shadow)"><rect x="1730" y="710" width="390" height="240" rx="20" fill="#1a181f" stroke="url(#orange)" stroke-width="3"/><path d="M1730 730Q1730 710 1750 710H2100Q2120 710 2120 730V768H1730Z" fill="url(#orange)"/><text x="1752" y="748" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="800">PROMO CODE</text><text x="1752" y="792" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">_id  PK</text><text x="1752" y="814" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">code  unique · discountPercent (0–1)</text><text x="1752" y="836" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">description · isActive · expiryDate</text><text x="1752" y="858" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">usageCount</text><text x="1752" y="880" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">createdAt · updatedAt</text><text x="1752" y="902" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="15">No current FK to Cart / Order</text></g><path d="M6