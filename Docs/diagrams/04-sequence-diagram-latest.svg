<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2160" viewBox="0 0 2400 2160">
<defs><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".28"/></filter><linearGradient id="purple" x1="0" x2="1"><stop stop-color="#4930a5"/><stop offset="1" stop-color="#7653df"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#d94f37"/><stop offset="1" stop-color="#ff7046"/></linearGradient><linearGradient id="lime" x1="0" x2="1"><stop stop-color="#bade32"/><stop offset="1" stop-color="#d8ff3e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d8ff3e"/></marker></defs><rect width="100%" height="100%" fill="#111014"/><text x="70" y="92" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="52" font-weight="800">MERCHROOM —</text><text x="70" y="152" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="52" font-weight="800">Sequence Diagram</text><text x="72" y="190" fill="#b9b4c9" font-family="Arial, sans-serif" font-size="21">Three essential live flows: browsing, checkout &amp; payment, and Nong Hed agentic shopping assistance</text><text x="2050" y="68" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="17" font-weight="700">SYSTEM SEQUENCES</text><rect x="2220" y="53" width="70" height="7" rx="4" fill="#d8ff3e"/><rect x="70" y="250" width="220" height="52" rx="18" fill="#d8ff3e"/><text x="180" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">Customer</text><path d="M180 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><rect x="390" y="250" width="220" height="52" rx="18" fill="#7653df"/><text x="500" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">React UI</text><path d="M500 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><rect x="740" y="250" width="220" height="52" rx="18" fill="#ff7046"/><text x="850" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">Express API</text><path d="M850 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><rect x="1090" y="250" width="220" height="52" rx="18" fill="#7653df"/><text x="1200" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">Controller / Service</text><path d="M1200 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><rect x="1460" y="250" width="220" height="52" rx="18" fill="#43d8cc"/><text x="1570" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">MongoDB</text><path d="M1570 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><rect x="1850" y="250" width="220" height="52" rx="18" fill="#f27aad"/><text x="1960" y="283" text-anchor="middle" fill="#18151c" font-family="Arial" font-size="17" font-weight="800">External APIs</text><path d="M1960 305V2120" stroke="#696078" stroke-width="2" stroke-dasharray="8 8"/><text x="70" y="350" fill="#d8ff3e" font-family="Arial" font-size="20" font-weight="800">A. PUBLIC CATALOGUE & PRODUCT FILTER</text><path d="M70 360H2290" stroke="#d8ff3e" stroke-width="2" opacity=".7"/><path d="M180 390H500" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="190" y="368" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="382" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Open product page or click a genre</text><path d="M500 430H850" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="510" y="408" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="422" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">GET /api/products?genre=&amp;search=&amp;category=</text><path d="M850 470H1200" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="860" y="448" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="462" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">listPublic()</text><path d="M1200 510H1570" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="488" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="502" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Product.find() + populate(artist, category)</text><path d="M1570 550H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="528" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="542" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">products + pagination</text><path d="M1200 590H850" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="860" y="568" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="582" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">200 JSON</text><path d="M850 630H500" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="510" y="608" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="622" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">filtered catalogue</text><path d="M500 670H180" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="190" y="648" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="662" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">render cards and filters</text><text x="70" y="745" fill="#ff7046" font-family="Arial" font-size="20" font-weight="800">B. CHECKOUT, PROMPTPAY QR AND CARD CHARGE</text><path d="M70 755H2290" stroke="#ff7046" stroke-width="2" opacity=".7"/><path d="M180 785H500" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="190" y="763" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="777" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Checkout with cart items + delivery details</text><path d="M500 825H850" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="510" y="803" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="817" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">POST /api/orders  (auth cookie)</text><path d="M850 865H1200" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="860" y="843" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="857" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">authUser → createOrder()</text><path d="M1200 905H1570" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="883" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="897" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">verify stock; create Order + Payment; decrement Product.quantity</text><path d="M1570 945H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="923" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="937" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">pending order / payment</text><path d="M500 985H850" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="510" y="963" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="977" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">PromptPay: POST /payments/orders/:id/initiate</text><path d="M850 1025H1200" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="860" y="1003" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1017" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">authUser → initiatePayment()</text><path d="M1200 1065H1570" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="1043" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="1057" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">reuse/create pending Payment</text><path d="M1570 1105H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1083" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="1097" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">payment record</text><path d="M1200 1145H850" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="860" y="1123" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1137" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">qrCodeUrl + pending payment</text><path d="M850 1185H500" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="510" y="1163" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="1177" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">render PromptPay QR</text><path d="M500 1225H850" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="510" y="1203" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="1217" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Card only: POST /payments/orders/:id/charge (token*)</text><path d="M850 1265H1200" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="860" y="1243" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1257" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">authUser → verify ownership → chargeCard()</text><path d="M1200 1305H1960" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="1283" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1297" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Omise charges.create() (server secret key)</text><path d="M1960 1345H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1323" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1337" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">paid / failed charge result</text><path d="M1200 1385H1570" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="1363" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="1377" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">save Payment + Order.processing; publish SSE</text><path d="M1200 1425H850" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="860" y="1403" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1417" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">payment response + order event</text><path d="M850 1465H500" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="510" y="1443" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="1457" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">refresh account/order state</text><path d="M500 1505H180" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="190" y="1483" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="1497" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">show payment + order status</text><text x="70" y="1570" fill="#f27aad" font-family="Arial" font-size="20" font-weight="800">C. NONG HED — AGENTIC PRODUCT ASSISTANT</text><path d="M70 1580H2290" stroke="#f27aad" stroke-width="2" opacity=".7"/><path d="M180 1610H500" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="190" y="1588" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="1602" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Ask by artist, stock, size or budget</text><path d="M500 1650H850" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="510" y="1628" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="1642" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">POST /api/chat  { message, history }</text><path d="M850 1690H1200" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="860" y="1668" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1682" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">rate limit → reply()</text><path d="M1200 1730H1960" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="1708" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1722" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">Gemini generateContent() with function tools</text><path d="M1960 1770H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1748" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1762" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">function call: search_products / check_stock / recommend_by_budget</text><path d="M1200 1810H1570" stroke="#d8ff3e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1210" y="1788" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="1802" text-anchor="middle" fill="#f7f5ff" font-family="Arial" font-size="14">live Product.find() + populate()</text><path d="M1570 1850H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1828" width="350" height="20" rx="5" fill="#111014"/><text x="1385" y="1842" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">verified product facts</text><path d="M1200 1890H1960" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1868" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1882" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">function response → Thai answer</text><path d="M1960 1930H1200" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1210" y="1908" width="740" height="20" rx="5" fill="#111014"/><text x="1580" y="1922" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">final response + selected product ids</text><path d="M1200 1970H850" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="860" y="1948" width="330" height="20" rx="5" fill="#111014"/><text x="1025" y="1962" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">answer, products, cartActions</text><path d="M850 2010H500" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="510" y="1988" width="330" height="20" rx="5" fill="#111014"/><text x="675" y="2002" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">chat product cards / Add to cart action</text><path d="M500 2050H180" stroke="#b9b4c9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="190" y="2028" width="300" height="20" rx="5" fill="#111014"/><text x="340" y="2042" text-anchor="middle" fill="#b9b4c9" font-family="Arial" font-size="14">read answer or add confirmed item</text><text x="70" y="2110" fill="#b9b4c9" font-family="Arial" font-size="15">*The backend accepts a valid Omise token, but the current React UI does not yet integrate Omise.js. PromptPay currently returns a QR intent and remains pending until payment status is updated. Gemini only receives controlled live-product tools.</text></svg>