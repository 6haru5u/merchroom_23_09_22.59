<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merchroom Knowledge Graph</title>
  <style>
    :root { color-scheme: light; --ink:#231f20; --muted:#6f6870; --line:#d9d3cd; --paper:#fbfaf8; --panel:#fff; --accent:#6656c7; --brand:#ff5533; --soft:#f2effc; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { padding:22px clamp(18px,4vw,56px); border-bottom:1px solid var(--line); background:var(--panel); }
    h1 { margin:0; font-size:clamp(1.3rem,3vw,2rem); }
    header p { margin:5px 0 0; color:var(--muted); }
    .controls { display:flex; flex-wrap:wrap; gap:10px; padding:16px clamp(18px,4vw,56px); background:var(--panel); border-bottom:1px solid var(--line); }
    input,select,button { font:inherit; }
    input,select { min-height:40px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:0 12px; color:var(--ink); }
    input { flex:1 1 250px; }
    button { min-height:40px; border:1px solid var(--accent); border-radius:8px; padding:0 14px; background:var(--accent); color:#fff; cursor:pointer; }
    button:hover { filter:brightness(.95); }
    .summary { padding:10px clamp(18px,4vw,56px); color:var(--muted); font-size:.9rem; }
    main { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,360px); gap:16px; padding:0 clamp(18px,4vw,56px) 32px; }
    .graph-wrap { min-height:680px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    #graph { min-width:980px; width:100%; height:720px; display:block; }
    .edge { stroke:#c9c2bc; stroke-width:1.35; opacity:.72; }
    .node { cursor:pointer; }
    .node circle { stroke:#fff; stroke-width:2; }
    .node text { fill:#fff; font-weight:600; font-size:11px; text-anchor:middle; pointer-events:none; }
    .node.dim { opacity:.14; }
    .node.selected circle { stroke:var(--ink); stroke-width:3.5; }
    .detail { position:sticky; top:16px; align-self:start; min-height:260px; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:20px; }
    .detail h2 { margin:0 0 8px; font-size:1.25rem; }
    .detail p { margin:0 0 14px; color:var(--muted); }
    .meta { margin:0 0 14px; font-size:.85rem; }
    .meta dt { margin-top:8px; color:var(--muted); font-weight:600; }
    .meta dd { margin:2px 0; overflow-wrap:anywhere; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 14px; }
    .tag { border-radius:99px; background:var(--soft); color:#4c3faa; padding:3px 8px; font-size:.78rem; }
    .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    .gallery img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:7px; border:1px solid var(--line); background:#f4f2ef; }
    .gallery a { display:block; }
    .empty { color:var(--muted); font-size:.9rem; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } .detail { position:static; } }
  </style>
</head>
<body>
  <header><h1>Merchroom Knowledge Graph</h1><p>คลิก node เพื่อดูคำอธิบาย แหล่งข้อมูล และรูปภาพที่เชื่อมโยง</p></header>
  <div class="controls">
    <input id="search" type="search" placeholder="ค้นหา node, tag หรือคำอธิบาย" aria-label="ค้นหา node">
    <select id="tag-filter" aria-label="กรองตามหมวดหมู่"><option value="">ทุกหมวดหมู่</option></select>
    <button id="reset" type="button">แสดงทั้งหมด</button>
  </div>
  <div id="summary" class="summary" aria-live="polite"></div>

    <section class="graph-wrap" aria-label="แผนผังความรู้"><svg id="graph" viewBox="0 0 1120 720" role="img" aria-label="Merchroom knowledge graph"></svg></section>

    const colors = {brand:'#ff5533',business:'#e17630',actor:'#2d7a7a',system:'#5266b3',database:'#7965b5',catalog:'#996034',content:'#be5682',admin:'#aa4d4d',payment:'#27856c',frontend:'#5266b3'};
    const positions = {}; const cols=6; nodes.forEach((node,i)=>{ const col=i%cols,row=Math.floor(i/cols); positions[node.id]={x:100+col*184+(row%2?30:0),y:75+row*112}; });
    const svg=document.getElementById('graph'), detail=document.getElementById('detail'), search=document.getElementById('search'), filter=document.getElementById('tag-filter'), summary=document.getElementById('summary');
    const ns='http://www.w3.org/2000/svg'; let selectedId=null;
    const allTags=[...new Set(nodes.flatMap(n=>n.tags))].sort(); allTags.forEach(tag=>{const o=document.createElement('option');o.value=tag;o.textContent=tag;filter.append(o)});
    function el(name,attrs={}){const e=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
    function nodeColor(node){return colors[node.tags.find(t=>colors[t])]||'#6656c7'}
    function draw(){
      const q=search.value.trim().toLowerCase(), tag=filter.value;
      const visible=new Set(nodes.filter(n=>!q||`${n.name} ${n.description} ${n.tags.join(' ')}`.toLowerCase().includes(q)).filter(n=>!tag||n.tags.includes(tag)).map(n=>n.id));
      svg.replaceChildren();
      edges.forEach(([a,b])=>{const pa=positions[a],pb=positions[b];if(!pa||!pb)return;const l=el('line',{x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,class:'edge'});if(!visible.has(a)||!visible.has(b))l.style.opacity='.08';svg.append(l)});
      nodes.forEach(node=>{const p=positions[node.id],g=el('g',{class:`node ${visible.has(node.id)?'':'dim'} ${selectedId===node.id?'selected':''}`,tabindex:'0',role:'button','aria-label':node.name});const c=el('circle',{cx:p.x,cy:p.y,r:39,fill:nodeColor(node)});const t=el('text',{x:p.x,y:p.y-5});const words=node.name.split(' ');t.textContent=words.slice(0,2).join(' ');const t2=el('text',{x:p.x,y:p.y+10});t2.textContent=words.slice(2,4).join(' ');g.append(c,t);if(t2.textContent)g.append(t2);g.addEventListener('click',()=>select(node.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(node.id)}});svg.append(g)});
      summary.textContent=`แสดง ${visible.size} จาก ${nodes.length} nodes และ ${edges.filter(([a,b])=>visible.has(a)&&visible.has(b)).length} จาก ${edges.length} relationships`;
    }
    function select(id){selectedId=id;const n=nodes.find(x=>x.id===id);const tags=n.tags.map(t=>`<span class="tag">${t}</span>`).join('');const images=n.image_paths.length?n.image_paths.map((path,i)=>`<a href="${path}" target="_blank" rel="noopener"><img src="${path}" alt="${n.name} ภาพ ${i+1}"></a>`).join(''):'<span class="empty">ไม่มีรูปภาพที่ผูกโดยตรง</span>';detail.innerHTML=`<h2>${n.name}</h2><p>${n.description}</p><div class="tags">${tags}</div><dl class="meta"><dt>Node ID</dt><dd><code>${n.id}</code></dd><dt>ที่มา</dt><dd>${n.source_files.map(x=>`<code>${x}</code>`).join('<br>')}</dd></dl><div class="gallery">${images}</div>`;draw()}
    search.addEventListener('input',draw); filter.addEventListener('change',draw); document.getElementById('reset').addEventListener('click',()=>{search.value='';filter.value='';selectedId=null;detail.innerHTML='<h2>เลือก node</h2><p>เลือกจุดในกราฟเพื่อดูรายละเอียดและรูปภาพที่เชื่อมโยง</p>';draw()}); draw();
  </script>
